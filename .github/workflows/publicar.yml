name: Publicar en GitHub Pages

# Cada vez que algo entra a main, se compila y se publica en
# https://lahoyosc.github.io/huellas-a-casa/
#
# Configurar una sola vez, en Settings -> Secrets and variables ->
# Actions -> pestaña VARIABLES (no secretos: son valores publicos):
#   VITE_SUPABASE_URL       -> https://xxxx.supabase.co
#   VITE_SUPABASE_ANON_KEY  -> la llave anon
#
# La primera corrida activa GitHub Pages sola. Si falla con un error de
# permisos, ir a Settings -> Pages -> Source y elegir "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Compilar
        env:
          VITE_BASE: /huellas-a-casa/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::warning::Faltan VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY en Settings -> Variables. La pagina se publica pero no va a cargar datos."
          fi
          npm run build
          # Para que las rutas funcionen al recargar en Pages
          cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
