name: Respaldo de la base de datos

# Saca una copia completa de la base todas las noches y la guarda en un
# repositorio PRIVADO aparte (huellas-a-casa-respaldos). Es lo unico que
# los protege de un borrado accidental: el plan gratuito de Supabase NO
# tiene backups.
#
# Por que privado y aparte: los respaldos traen telefonos de particulares
# (tabla busquedas). Este repositorio es publico; alli no pueden ir.
#
# Retencion: los diarios se conservan 30 dias; el del dia 1 de cada mes
# se conserva para siempre.
#
# Secretos necesarios (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL    Cadena de conexion de Supabase. OJO: usar la del
#                      POOLER en modo Session (Project Settings > Database
#                      > Connection string > Method: Session pooler). La
#                      conexion "directa" es solo IPv6 y desde GitHub no
#                      llega.
#   RESPALDO_SSH_KEY   Llave privada con permiso de escritura en el
#                      repositorio de respaldos (ya configurada).

on:
  schedule:
    - cron: "0 7 * * *"   # 2:00 a.m. hora de Colombia
  workflow_dispatch:       # y tambien a mano, desde la pestana Actions

env:
  REPO_RESPALDOS: git@github.com:LAHoyosC/huellas-a-casa-respaldos.git

jobs:
  respaldar:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente de Postgres 17
        # El cliente debe ser igual o mas nuevo que el servidor de Supabase.
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          # Ubuntu trae tambien el 16; usar el 17 explicitamente
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Preparar llave SSH
        env:
          LLAVE: ${{ secrets.RESPALDO_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$LLAVE" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Traer el repositorio de respaldos
        run: |
          git clone --depth 1 "$REPO_RESPALDOS" respaldos
          cd respaldos
          git config user.name  "respaldo-automatico"
          git config user.email "actions@github.com"
          # Si el repositorio esta vacio, arrancar la rama main
          git rev-parse HEAD >/dev/null 2>&1 || git checkout -b main

      - name: Sacar la copia
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Falta el secreto SUPABASE_DB_URL."; exit 1
          fi
          mkdir -p respaldos/diarios respaldos/mensuales
          FECHA=$(date +%Y-%m-%d)
          ARCHIVO="respaldos/diarios/huellas-a-casa-$FECHA.sql.gz"
          if ! pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges --schema=public \
               | gzip > "$ARCHIVO"; then
            echo "::error::pg_dump fallo. Si el error es de conexion (timeout / could not connect), revisa que SUPABASE_DB_URL sea la del Session pooler, no la directa."
            exit 1
          fi
          # Un dump vacio o minusculo es senal de que algo salio mal
          TAM=$(stat -c %s "$ARCHIVO")
          echo "Tamano del respaldo: $TAM bytes"
          if [ "$TAM" -lt 500 ]; then
            echo "::error::El respaldo quedo casi vacio ($TAM bytes). No se guarda."; exit 1
          fi
          # El dia 1 de cada mes se guarda ademas una copia permanente
          if [ "$(date +%d)" = "01" ]; then
            cp "$ARCHIVO" "respaldos/mensuales/huellas-a-casa-$(date +%Y-%m).sql.gz"
          fi

      - name: Dejar solo los ultimos 30 diarios
        run: |
          cd respaldos/diarios
          ls -1t *.sql.gz 2>/dev/null | tail -n +31 | xargs -r rm --

      - name: Guardar en el repositorio privado
        run: |
          cd respaldos
          git add -A
          git diff --staged --quiet && { echo "Nada nuevo"; exit 0; }
          git commit -m "Respaldo $(date +%Y-%m-%d)"
          git push origin HEAD:main
