name: Verificar (CI)

# Corre en cada pull request. Comprueba que el proyecto compila y que el
# motor de coincidencias sigue dando lo esperado (scripts/probar-cruce.mjs).
# NO publica nada: la pagina en produccion no se toca desde aqui.
# La vista previa de cada PR la genera Cloudflare Pages por su cuenta.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run probar
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://ci.invalid
          VITE_SUPABASE_ANON_KEY: ci
