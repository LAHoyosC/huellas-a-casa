name: Verificar (CI)

# Corre en cada pull request hacia main. NO publica nada: producción solo
# cambia cuando el PR se fusiona (Cloudflare la despliega solo). La vista
# previa de cada PR la genera Cloudflare por su cuenta, contra staging.
#
# Tres trabajos, los tres obligatorios para poder fusionar:
#
#   compilar        npm ci, motor de cruce (npm run probar) y build en los
#                   dos modos (producción y staging), igual que Cloudflare.
#
#   base-de-datos   Levanta un Postgres limpio; aplica las migraciones que ya
#                   están en main; carga datos de mentira; aplica SOLO las
#                   nuevas del PR sobre esos datos (dos veces cada una);
#                   comprueba que no se perdió ninguna fila, que el código
#                   encuentra todas sus columnas/funciones
#                   (scripts/probar-esquema.mjs) y que el público sigue sin
#                   leer contactos ni poder borrar (scripts/ci/probar-rls.sql).
#
#   revisar         Reglas del repo: migraciones solo se agregan (nunca se
#                   editan ni borran) y nada destructivo (lint por nivel:
#                   prohibida/crítica/aditiva), sin secretos, sin archivos
#                   generados, aviso si el PR toca archivos delicados.
#
#   pagina          Abre la página en Chromium contra la compilación del PR
#                   y recorre las pantallas: si revienta al cargar, rojo.
#
# Hay un quinto check, en aprobacion.yml: si el PR toca archivos delicados
# (scripts/ci/delicados.txt) exige la aprobación de Lau; si no, pasa solo.
# Con los cinco en verde el PR se fusiona (auto-merge, squash).
#
# Si algo falla, el mensaje dice qué y cómo arreglarlo. Léelo antes de
# tocar nada.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    name: compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Motor de cruce (casos en scripts/probar-cruce.mjs)
        run: npm run probar
      - name: Compilar como producción (main)
        run: npm run build
      - name: Compilar como staging (cualquier otra rama)
        run: npm run build
        env:
          WORKERS_CI_BRANCH: vista-previa

  base-de-datos:
    name: base-de-datos
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: huellas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      URL: postgresql://postgres:ci@localhost:5432/huellas
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar psql
        run: sudo apt-get install -y -q postgresql-client >/dev/null

      - name: Preparar lo mínimo de Supabase (roles, auth, storage, permisos por defecto)
        run: psql "$URL" -X -v ON_ERROR_STOP=1 -q -f scripts/ci/supabase-minimo.sql

      - name: Separar migraciones que ya están en main de las nuevas del PR
        run: |
          git ls-tree -r --name-only "origin/${{ github.base_ref }}" supabase/migrations | sort > en_main.txt
          if [ ! -s en_main.txt ]; then echo "::error::No encontré las migraciones de ${{ github.base_ref }} (¿fetch-depth?)."; exit 1; fi
          ls supabase/migrations/*.sql | sort > todas.txt
          comm -13 en_main.txt todas.txt > nuevas.txt
          echo "En main: $(wc -l < en_main.txt) · Nuevas en este PR: $(wc -l < nuevas.txt)"
          cat nuevas.txt

      # Cada migración se corre dos veces seguidas: si un `db push` se
      # interrumpe y se repite, no puede romperse. Por eso todo va con
      # `if not exists`, `create or replace`, `drop ... if exists`.
      - name: 1/4 Aplicar desde cero las migraciones que ya están en main
        run: |
          set -e
          while read -r f; do
            [ -z "$f" ] && continue
            echo "==> $f"
            psql "$URL" -X -v ON_ERROR_STOP=1 -q -f "$f" || { echo "::error file=$f::Una migración YA fusionada falla desde cero. Esto no lo causó tu PR: avisa a Lau."; exit 1; }
            SALIDA=$(psql "$URL" -X -v ON_ERROR_STOP=1 -q -f "$f" 2>&1) || { echo "$SALIDA" | grep -v NOTICE; echo "::error file=$f::Migración ya fusionada no re-ejecutable. Avisa a Lau."; exit 1; }
          done < en_main.txt
          echo "OK: $(wc -l < en_main.txt) migraciones de main aplicadas."

      - name: 2/4 Cargar datos de mentira (todas las columnas y estados)
        run: |
          psql "$URL" -X -v ON_ERROR_STOP=1 -q -f scripts/ci/semilla.sql
          psql "$URL" -X -A -t -c "select 'mascotas='||(select count(*) from mascotas)||' busquedas='||(select count(*) from busquedas)||' historial='||(select count(*) from historial)||' voluntarios='||(select count(*) from voluntarios)" | tee antes.txt

      - name: 3/4 Aplicar SOLO las migraciones nuevas del PR sobre esos datos (dos veces cada una)
        run: |
          set -e
          if [ ! -s nuevas.txt ]; then echo "Este PR no trae migraciones nuevas."; exit 0; fi
          while read -r f; do
            [ -z "$f" ] && continue
            echo "==> $f"
            psql "$URL" -X -v ON_ERROR_STOP=1 -q -f "$f" || {
              echo "::error file=$f::Esta migración falla al aplicarse sobre la base con datos. Puede ser un 'set not null' o un 'check' que las filas viejas no cumplen. Arréglala en este PR."; exit 1; }
            SALIDA=$(psql "$URL" -X -v ON_ERROR_STOP=1 -q -f "$f" 2>&1) || {
              echo "$SALIDA" | grep -v NOTICE
              echo "::error file=$f::Esta migración no se puede correr dos veces seguidas. Usa 'if not exists', 'create or replace', 'drop ... if exists'."; exit 1; }
          done < nuevas.txt
          echo "OK: migraciones nuevas aplicadas sobre datos, y cada una es re-ejecutable."

      - name: 4/4 Ninguna fila se perdió
        run: |
          psql "$URL" -X -A -t -c "select 'mascotas='||(select count(*) from mascotas)||' busquedas='||(select count(*) from busquedas)||' historial='||(select count(*) from historial)||' voluntarios='||(select count(*) from voluntarios)" | tee despues.txt
          # historial solo puede crecer; el resto debe ser igual.
          A=$(sed 's/ historial=[0-9]*//' antes.txt); D=$(sed 's/ historial=[0-9]*//' despues.txt)
          if [ "$A" != "$D" ]; then
            echo "::error::Después de aplicar las migraciones del PR cambió el número de filas: antes «$(cat antes.txt)», después «$(cat despues.txt)». Aquí nada se borra."; exit 1
          fi
          echo "OK: mismas filas antes y después."

      - name: El código encuentra todas sus columnas y funciones
        run: |
          psql "$URL" -X -A -t -c "$(node scripts/probar-esquema.mjs --consulta)" > esquema.txt
          node scripts/probar-esquema.mjs esquema.txt

      - name: El público no lee contactos ni borra nada (prueba de RLS)
        run: |
          psql "$URL" -X -v ON_ERROR_STOP=1 -q -f scripts/ci/probar-rls.sql || {
            echo "::error::La prueba de permisos (scripts/ci/probar-rls.sql) falló: alguna migración abre algo que debe estar cerrado, o le falta un grant/revoke. Lee el assert de arriba."; exit 1; }

  revisar:
    name: revisar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qué archivos cambia este PR
        id: cambios
        run: |
          BASE="origin/${{ github.base_ref }}"
          git diff --name-status "$BASE"...HEAD > cambios.txt
          cat cambios.txt
          echo "n=$(wc -l < cambios.txt)" >> "$GITHUB_OUTPUT"

      - name: Migraciones solo se AGREGAN (nunca se editan ni borran)
        run: |
          MAL=$(awk '$1 != "A" && $2 ~ /^supabase\/migrations\//' cambios.txt || true)
          if [ -n "$MAL" ]; then
            echo "$MAL"
            echo "::error::Una migración ya existente fue modificada o borrada. Las migraciones fusionadas ya corrieron en producción: no se tocan. Deshaz el cambio y agrega una migración NUEVA con el siguiente número."
            exit 1
          fi
          # Las nuevas tienen que venir con el formato y con número mayor que todas las que ya hay.
          ULT=$(git ls-tree -r --name-only "origin/${{ github.base_ref }}" supabase/migrations | sort | tail -1 | xargs -r basename)
          for f in $(awk '$1 == "A" && $2 ~ /^supabase\/migrations\// {print $2}' cambios.txt); do
            b=$(basename "$f")
            echo "$b" | grep -Eq '^[0-9]{14}_[a-z0-9_]+\.sql$' || { echo "::error file=$f::Nombre inválido. Formato: YYYYMMDDNNNNNN_nombre_en_minusculas.sql"; exit 1; }
            if [ -n "$ULT" ] && [ "$b" \< "$ULT" ]; then
              echo "::error file=$f::La migración nueva ($b) tiene un número menor que la última ya fusionada ($ULT). Renómbrala con un número mayor."; exit 1
            fi
          done
          echo "OK"

      - name: "Migraciones nuevas: nada destructivo (lint por nivel)"
        # prohibida -> error. critica -> aviso (exige aprobación de Lau: lo
        # comprueba el check «aprobacion»). aditiva -> pasa sola.
        # La tabla de niveles está en scripts/clasificar-migracion.mjs y en CLAUDE.md §4.
        run: |
          NUEVAS=$(awk '$1 == "A" && $2 ~ /^supabase\/migrations\// {print $2}' cambios.txt)
          if [ -z "$NUEVAS" ]; then echo "Sin migraciones nuevas."; exit 0; fi
          node scripts/clasificar-migracion.mjs $NUEVAS | tee niveles.txt || true
          if grep -q "^prohibida" niveles.txt; then
            echo "::error::Migración PROHIBIDA: aquí nada se borra (ni tablas, ni columnas, ni filas), no se apaga RLS ni se hace update sin where. Si necesitas quitar algo, deja de usarlo en el código y déjalo en la base; si de verdad hay que borrarlo, habla con Lau."
            grep "^prohibida" niveles.txt | sed 's/^/  - /'
            exit 1
          fi
          if grep -q "^critica" niveles.txt; then
            echo "::warning::Migración CRÍTICA (crea tabla, toca RLS/permisos/funciones security definer/tipos/datos): pasa las pruebas pero necesita la aprobación de Lau (check «aprobacion»). Explica en el PR por qué."
            grep "^critica" niveles.txt | sed 's/^/  - /'
            { echo "### 🔒 Migración crítica: necesita aprobación de Lau"; echo; grep "^critica" niveles.txt | awk -F'\t' '{print "- `"$2"` — "$3}'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if grep -q "^aditiva" niveles.txt; then
            echo "Migraciones aditivas (solo agregan): con el CI en verde se fusionan y aplican solas."
            grep "^aditiva" niveles.txt | sed 's/^/  - /'
          fi

      - name: Sin secretos ni credenciales
        run: |
          set +e
          # Solo revisamos las líneas AGREGADAS por este PR (no toda la historia).
          git diff "origin/${{ github.base_ref }}"...HEAD -U0 -- . ':(exclude)package-lock.json' ':(exclude).github/workflows/verificar.yml' \
            | grep -E '^\+' | grep -vE '^\+\+\+' > agregado.txt
          PATRONES='sb_secret_|service_role_key|SERVICE_ROLE_KEY|BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY|postgres(ql)?://[^:@\s]+:[^@\s]+@(?!localhost|127\.0\.0\.1)|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|github_pat_|xox[bp]-|eyJhbGciOi[A-Za-z0-9_-]{40,}\.[A-Za-z0-9_-]{40,}'
          if grep -nP "$PATRONES" agregado.txt; then
            echo "::error::Parece que este PR agrega un secreto (llave privada, service_role, URL de base con contraseña, token…). Los secretos van en GitHub → Settings → Secrets, nunca en el código. Si es un falso positivo, dilo en el PR."
            exit 1
          fi
          # Archivos que nunca deben entrar.
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -E '(^|/)\.env(\.local)?$'; then
            echo "::error::Se está subiendo un archivo .env o .env.local. Está en .gitignore por algo: sácalo del commit."
            exit 1
          fi
          echo "OK: sin secretos en lo agregado."

      - name: Sin archivos generados
        run: |
          if grep -E '^[AM]\s+(dist/|worker/entorno\.js|node_modules/)' cambios.txt; then
            echo "::error::dist/, node_modules/ y worker/entorno.js se generan al compilar; no van en el PR. Sácalos del commit (git checkout origin/main -- worker/entorno.js)."
            exit 1
          fi
          echo "OK"

      - name: Aviso si toca archivos delicados (necesitan aprobación de Lau)
        run: |
          tr -d '\r' < scripts/ci/delicados.txt | grep -vE '^\s*(#|$)' > patrones.txt
          : > delicados.txt
          while read -r ruta; do
            if [[ "$ruta" == */ ]]; then awk '{print $2}' cambios.txt | grep -E "^${ruta}" >> delicados.txt || true
            else awk '{print $2}' cambios.txt | grep -Fx "$ruta" >> delicados.txt || true; fi
          done < patrones.txt
          if [ -s delicados.txt ]; then
            echo "::warning::Este PR toca archivos delicados (ver scripts/ci/delicados.txt). No es un error, pero NO se fusiona solo: necesita la aprobación de Lau (check «aprobacion»). Explica en el PR por qué."
            sort -u delicados.txt | sed 's/^/  - /'
          else
            echo "OK: no toca archivos delicados. Con el CI en verde se puede fusionar solo (auto-merge)."
          fi

      - name: delicados.txt y CODEOWNERS dicen lo mismo
        run: |
          tr -d '\r' < scripts/ci/delicados.txt | grep -vE '^\s*(#|$)' | sed 's#^#/#; s#/$##' | sort > a.txt
          tr -d '\r' < .github/CODEOWNERS | grep -E '^/' | awk '{print $1}' | sed 's#/$##' | sort > b.txt
          if ! diff a.txt b.txt; then
            echo "::error::scripts/ci/delicados.txt y .github/CODEOWNERS no coinciden (arriba: < solo en delicados, > solo en CODEOWNERS). Deben ser la misma lista."; exit 1
          fi
          echo "OK: misma lista."

      - name: Dependencias nuevas
        run: |
          if grep -qE '^M\s+package\.json' cambios.txt; then
            if git diff "origin/${{ github.base_ref }}"...HEAD -- package.json | grep -E '^\+\s+"[^"]+":\s*"[\^~0-9]' ; then
              echo "::warning::package.json agrega o cambia dependencias. Justifícalo en el PR (hoy son solo react, react-dom y supabase-js)."
            fi
          fi
          echo "OK"

  # No es obligatorio para fusionar. Aplica en STAGING las migraciones nuevas
  # del PR (ya validadas arriba) para que la vista previa de Cloudflare, que
  # usa esa base, funcione con el cambio. Staging es desechable: si dos PRs
  # se pisan ahí, no pasa nada; producción solo cambia al fusionar (migrar.yml).
  staging:
    name: staging (aplicar las migraciones del PR a la base de pruebas)
    needs: [base-de-datos, revisar]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: staging-migraciones
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Instalar psql
        run: sudo apt-get install -y -q postgresql-client >/dev/null
      - name: Aplicar en staging lo que falte
        env:
          URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          if [ -z "$URL" ]; then echo "::warning::Sin secreto SUPABASE_STAGING_DB_URL: la vista previa no tendrá las migraciones nuevas hasta que Lau las aplique en staging."; exit 0; fi
          bash scripts/ci/aplicar-migraciones.sh "$URL" staging

  # La página abierta en un navegador de verdad (Chromium), contra la
  # compilación de este PR en modo staging: portada, listado desde la base,
  # los dos formularios, estado del caso, pantalla de voluntarios. Si un
  # error de JavaScript la deja en blanco, aquí se ve. Un build "en verde"
  # no lo atrapa: el 18-ago-2026 producción se cayó por uno así.
  pagina:
    name: pagina
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Compilar como staging (la vista previa usa esa base)
        run: npm run build
        env:
          WORKERS_CI_BRANCH: vista-previa
      - name: Servir y abrir la página en el navegador
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:4173/ && break; sleep 1; done
          node scripts/ci/probar-pagina.mjs http://localhost:4173 || {
            echo "::error::La página se rompe al abrirse en el navegador (ver arriba el paso y el error de JavaScript). Este PR NO puede fusionarse: arréglalo en tu código."; exit 1; }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pantallazo-fallo
          path: pagina-fallo.png
          if-no-files-found: ignore
